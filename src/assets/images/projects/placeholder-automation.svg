<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Automation Script">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g font-family="'Fira Code', 'SF Mono', Menlo, monospace" font-size="24" fill="#9ca3af">
    <text x="70" y="120"><tspan fill="#3b82f6">def</tspan> <tspan fill="#f9fafb">run(target):</tspan></text>
    <text x="70" y="160">    data = fetch(target)</text>
    <text x="70" y="200">    export(data) <tspan fill="#10b981"># runs on a cron</tspan></text>
    <text x="70" y="240">    return ok</text>
  </g>
  <text x="70" y="308" font-family="Inter, sans-serif" font-size="44" font-weight="700" fill="#f9fafb">Automation Script</text>
  <text x="70" y="346" font-family="Inter, sans-serif" font-size="22" fill="#9ca3af">Scheduled, unattended</text>
</svg>
